<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUANTUM CAPITAL | 量化未来</title>
    <style>
        :root {
            --primary-color: #00ff88; /* 量化绿 */
            --secondary-color: #ffd700; /* 金融金 */
            --bg-color: #050505;
            --text-color: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden; /* 防止滚动，全屏沉浸 */
            height: 100vh;
            cursor: crosshair; /* 变成准星，增加游戏感 */
        }

        /* 背景 Canvas */
        #gameCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* 前景 UI 层 */
        .ui-layer {
            position: relative;
            z-index: 10;
            pointer-events: none; /* 让鼠标事件穿透到 Canvas */
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: radial-gradient(circle at center, transparent 0%, #000000 120%);
        }

        /* 标题部分 */
        .hero-section {
            animation: fadeIn 2s ease-out;
            margin-bottom: 2rem;
            pointer-events: auto; /* 允许点击文字 */
        }

        h1 {
            font-size: 4rem;
            text-transform: uppercase;
            letter-spacing: 0.5rem;
            margin-bottom: 1rem;
            text-shadow: 0 0 20px var(--primary-color);
            background: linear-gradient(90deg, #fff, var(--primary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            font-size: 1.5rem;
            color: #ccc;
            letter-spacing: 0.2rem;
        }

        /* 数据展示卡片 */
        .stats-container {
            display: flex;
            gap: 2rem;
            margin-top: 3rem;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 2rem;
            border-radius: 15px;
            min-width: 200px;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.1);
            transition: transform 0.3s;
            pointer-events: auto;
        }

        .stat-card:hover {
            transform: translateY(-10px);
            border-color: var(--primary-color);
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--primary-color);
            display: block;
            margin-bottom: 0.5rem;
        }

        .stat-label {
            font-size: 0.9rem;
            text-transform: uppercase;
            color: #888;
        }

        /* 资产计数器 (游戏分数) */
        .asset-counter-box {
            position: absolute;
            top: 2rem;
            right: 2rem;
            text-align: right;
            background: rgba(0, 0, 0, 0.6);
            padding: 1rem 2rem;
            border-radius: 8px;
            border-left: 4px solid var(--secondary-color);
        }

        .asset-label {
            font-size: 0.8rem;
            color: #aaa;
            margin-bottom: 5px;
        }

        #totalAssets {
            font-family: 'Courier New', monospace;
            font-size: 2rem;
            color: var(--secondary-color);
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        /* 游戏提示 */
        .game-tip {
            position: absolute;
            bottom: 2rem;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.5);
            animation: pulse 2s infinite;
        }

        /* 动画定义 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0% { opacity: 0.3; }
            50% { opacity: 0.8; }
            100% { opacity: 0.3; }
        }

        /* 响应式 */
        @media (max-width: 768px) {
            h1 { font-size: 2.5rem; }
            .stats-container { flex-direction: column; }
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div class="ui-layer">
        
        <div class="asset-counter-box">
            <div class="asset-label">实时管理资产规模 (Real-time AUM)</div>
            <div id="totalAssets">¥ 10,000,000,000</div>
        </div>

        <div class="hero-section">
            <h1>Quantum Capital</h1>
            <p class="subtitle">以算法穿透迷雾 · 以数据重构价值</p>
        </div>

        <div class="stats-container">
            <div class="stat-card">
                <span class="stat-number">10 Year+</span>
                <span class="stat-label">量化投资经验</span>
            </div>
            <div class="stat-card">
                <span class="stat-number">100 Billion+</span>
                <span class="stat-label">资产管理规模</span>
            </div>
            <div class="stat-card">
                <span class="stat-number">AI Driven</span>
                <span class="stat-label">深度学习策略</span>
            </div>
        </div>

        <div class="game-tip">
            [ 移动鼠标捕捉浮动的 Alpha 收益 ]
        </div>
    </div>

    <script>
        /**
         * 游戏逻辑与动画系统
         */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const assetDisplay = document.getElementById('totalAssets');

        let width, height;
        let particles = [];
        let score = 10000000000; // 初始 100亿
        let mouse = { x: -100, y: -100 };

        // 格式化货币显示
        function formatMoney(num) {
            return '¥ ' + num.toLocaleString('en-US');
        }

        // 初始化画布尺寸
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // 鼠标监听
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        // 粒子类 (代表钱/Alpha)
        class Particle {
            constructor() {
                this.reset();
                this.y = Math.random() * height; // 初始随机分布
            }

            reset() {
                this.x = Math.random() * width;
                this.y = height + 50; // 从底部开始或重置到底部
                this.velocity = Math.random() * 2 + 1; // 上浮速度
                this.size = Math.random() * 20 + 10;
                // 随机符号：¥, $, %, Σ (量化符号)
                const symbols = ['¥', '$', '€', 'Σ', 'α', 'β'];
                this.symbol = symbols[Math.floor(Math.random() * symbols.length)];
                this.color = Math.random() > 0.8 ? '#ffd700' : '#00ff88'; // 金色或绿色
                this.opacity = Math.random() * 0.5 + 0.1;
                this.value = Math.floor(Math.random() * 100000) + 50000; // 每个粒子的价值
            }

            update() {
                // 向上浮动 (寓意资产增值)
                this.y -= this.velocity;

                // 鼠标交互 (收集)
                const dx = this.x - mouse.x;
                const dy = this.y - mouse.y;
                const distance = Math.sqrt(dx * dx + dy * dy);

                // 碰撞检测距离 (鼠标半径 80px)
                if (distance < 80) {
                    this.collect();
                }

                // 超出屏幕顶部重置
                if (this.y < -50) {
                    this.reset();
                }
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.globalAlpha = this.opacity;
                ctx.font = `bold ${this.size}px monospace`;
                ctx.fillText(this.symbol, this.x, this.y);
                
                // 增加一点辉光效果
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.color;
            }

            collect() {
                // 增加分数
                score += this.value;
                assetDisplay.innerText = formatMoney(score);
                assetDisplay.style.color = '#fff'; // 闪烁白色
                setTimeout(() => assetDisplay.style.color = '#ffd700', 100);

                // 触发特效 (创建爆炸效果)
                createExplosion(this.x, this.y, this.color);
                
                // 重置粒子
                this.reset();
            }
        }

        // 爆炸特效粒子
        let explosions = [];
        class ExplosionParticle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 3 + 1;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.life = 1.0; // 生命值
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= 0.03;
            }
            draw() {
                ctx.globalAlpha = this.life;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 2, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function createExplosion(x, y, color) {
            for(let i=0; i<8; i++) {
                explosions.push(new ExplosionParticle(x, y, color));
            }
        }

        // 初始化粒子群
        function init() {
            // 根据屏幕宽度决定粒子数量
            const particleCount = width > 768 ? 100 : 50;
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }

        // 动画循环
        function animate() {
            // 清除画布 (带一点拖尾效果)
            ctx.fillStyle = 'rgba(5, 5, 5, 0.2)';
            ctx.fillRect(0, 0, width, height);
            
            // 更新主要的钱币粒子
            particles.forEach(p => {
                p.update();
                p.draw();
            });

            // 更新爆炸特效
            for (let i = explosions.length - 1; i >= 0; i--) {
                const e = explosions[i];
                e.update();
                e.draw();
                if (e.life <= 0) {
                    explosions.splice(i, 1);
                }
            }
            
            // 自动增长逻辑 (模拟被动收益)
            if (Math.random() > 0.95) {
                score += 10000;
                assetDisplay.innerText = formatMoney(score);
            }

            requestAnimationFrame(animate);
        }

        init();
        animate();

    </script>
</body>
</html>
